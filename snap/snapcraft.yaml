name: extend-rosbridge
base: core20 # the base snap is the execution environment for this snap
version: '7.2' # just for humans, typically '1.2+git' or '1.3.2'
summary: Snap containing rosbridge only for debugging
description: |
  This snap contains debugging version

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots

parts:
  rosbridge-workspace:
    # See 'snapcraft plugins'
    plugin: catkin
    source: .
    catkin-packages: [rosbridge_server,rosbridge_msgs,rosbridge_library,rosapi,rosbridge_suite]

    stage-packages:
       - ros-noetic-roslaunch
       - ros-noetic-rosbash
       - ros-noetic-rosservice
       - ros-noetic-rosparam
       - lsb-release
       - lsb-core
       - python3-rosdep
       - python3-rosinstall
       - python3-rosinstall-generator
       - python3-wstool
       - python3-autobahn
       - python3-tornado
       - python3-twisted
       - python3-setuptools
       - python3-pil
       - python3-bson
       - ros-noetic-rospy

  local-files:
    plugin: dump
    source: snap/local/
    organize:
      'lsb_release': usr/sbin/

apps:
  #Debug Apps
  rosbridge-server:
    command: opt/ros/noetic/bin/roslaunch rosbridge_server rosbridge_websocket.launch
    extensions: [ros1-noetic]
    
  rosservice:
    command: opt/ros/noetic/bin/rosservice
    extensions: [ros1-noetic]

  rosparam:
    command: opt/ros/noetic/bin/rosparam
    extensions: [ros1-noetic]

  lsb-release:
    command: usr/sbin/lsb_release
    extensions: [ros1-noetic]


